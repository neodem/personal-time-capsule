# yaml-language-server: $schema=../schema/capsule.schema.json
# capsule.yaml — a Personal Time Capsule's "constitution."
#
# This is a worked, heavily annotated EXAMPLE, not a schema file — field
# names and structure are what matter; the values below (dates, names,
# institutions) are illustrative only. See ../FORMAT.md for the full
# field-by-field explanation and the directory layout this file assumes.
#
# This file is a BagIt tag file: it lives at the root of the bag, next to
# bagit.txt and manifest-sha256.txt, NOT inside data/.

capsule:
  spec_version: "PTC-0.1"
  id: "urn:uuid:3f29c1de-9b1a-4c7e-8e0a-2a6f7e5b6d10"
  created: "2026-08-29"
  creator:
    # Per PRINCIPLES.md #2, the creator controls what identifying
    # information appears here at all — everything under `creator`
    # beyond `id`/`created` above is optional.
    name: "Jane Smith"
    contact: "jane@example.org"

purpose:
  description: >
    A personal historical archive documenting an ordinary life —
    email, photographs, writing, and home video from 1995 onward —
    for descendants and future historians.

# Named groupings of payload content under data/. A collection with no
# privacy_zone/release_policy simply inherits the capsule-wide default
# declared under `access` below — only declare an override here.
collections:
  - name: photos
    path: data/photos
    # no override: inherits access.default_privacy_zone / default_release_policy

  - name: writing
    path: data/writing
    # no override

  - name: email
    path: data/email
    privacy_zone: restricted
    release_policy:
      type: after_death_plus_years
      years: 50

  - name: journal
    path: data/journal
    privacy_zone: never-release
    release_policy:
      type: never

  - name: person
    path: data/person
    # the human-context layer itself (biography, timeline, people, places)
    # no override: inherits the capsule default

access:
  # one of: public | restricted | never-release
  default_privacy_zone: restricted
  default_release_policy:
    # one of: immediate | fixed_date | after_death | after_death_plus_years | never | custom
    type: fixed_date
    date: "2076-08-20"

custody:
  primary:
    name: "TBD — a special collections department or similar institution"
    type: institution
  successors:
    - name: "TBD — fallback institution #1"
      type: institution
    - name: "TBD — fallback institution #2"
      type: institution

encryption:
  # STUB — see FORMAT.md. Algorithm/key-splitting scheme are a separate,
  # not-yet-designed Phase 2 item (encryption model). This section only
  # fixes the shape of key custody so tooling has something to build against.
  status: planned    # planned | encrypted | none
  key_custody:
    scheme: quorum
    quorum:
      required: 3
      of: 5
    trustees: []      # populated at the Encryption & policy binding lifecycle stage

integrity:
  manifest_algorithm: sha256

status:
  # tracks LIFECYCLE.md's stages
  lifecycle_stage: origination
