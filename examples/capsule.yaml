# yaml-language-server: $schema=../schema/capsule.schema.json
# capsule.yaml — a Personal Time Capsule's "constitution."
#
# This is a worked, heavily annotated EXAMPLE, not a schema file — field
# names and structure are what matter; the values below (dates, names,
# institutions) are illustrative only. See ../FORMAT.md for the full
# field-by-field explanation and the directory layout this file assumes.
#
# This file is a BagIt tag file: it lives at the root of the bag, next to
# bagit.txt and manifest-sha256.txt, NOT inside data/.

capsule:
  spec_version: "PTC-0.1"
  id: "urn:uuid:3f29c1de-9b1a-4c7e-8e0a-2a6f7e5b6d10"
  created: "2026-08-29"
  creator:
    # Per PRINCIPLES.md #2, the creator controls what identifying
    # information appears here at all — everything under `creator`
    # beyond `id`/`created` above is optional.
    name: "Jane Smith"
    contact: "jane@example.org"

purpose:
  description: >
    A personal historical archive documenting an ordinary life —
    email, photographs, writing, and home video from 1995 onward —
    for descendants and future historians.

# Optional — most capsules are a creator's only one, and this one (Jane's
# first) doesn't actually use it. Shown here for reference: if Jane later
# makes a second capsule picking up where this one leaves off, THAT
# capsule's series.continues would name THIS capsule's own id above.
# One-directional only — see FORMAT.md — so this capsule itself has no
# "continued_by" field pointing forward to a successor that may not even
# exist yet.
#
# series:
#   continues: "urn:uuid:<an earlier capsule's own id>"
#   note: "Picks up where the earlier capsule left off; covers 2026 onward."

# Named groupings of payload content under data/. A collection with no
# privacy_zone/release_policy simply inherits the capsule-wide default
# declared under `access` below — only declare an override here.
collections:
  - name: photos
    path: data/photos
    # no override: inherits access.default_privacy_zone / default_release_policy

  - name: writing
    path: data/writing
    # no override

  - name: email
    path: data/email
    privacy_zone: restricted
    release_policy:
      type: after_death_plus_years
      years: 50
    # A distinct release_policy from the capsule default (fixed_date
    # 2076, below) means this collection needs its own encryption
    # block too — see ../ENCRYPTION.md "Encryption granularity." A
    # single shared key would mean unlocking this collection at its
    # trigger also hands trustees the ability to decrypt everything
    # else that used the same key.
    encryption:
      status: planned
      algorithm: xchacha20-poly1305
      key_custody:
        scheme: quorum
        splitting_scheme: slip-0039
        quorum:
          required: 2
          of: 3
        trustees:
          - name: "Priya Smith (daughter)"
            share_index: 1
          - name: "Alex Smith (son)"
            share_index: 2
          - name: "Riverside Public Library (successor custodian)"
            share_index: 3

  - name: journal
    path: data/journal
    privacy_zone: never-release
    release_policy:
      type: never
    # "Never" only means something if this collection's key isn't
    # shared with any collection that IS meant to eventually unlock —
    # its own encryption block, own quorum, own trustees.
    encryption:
      status: planned
      algorithm: xchacha20-poly1305
      key_custody:
        scheme: quorum
        splitting_scheme: slip-0039
        quorum:
          required: 3
          of: 3
        trustees:
          - name: "Priya Smith (daughter)"
            share_index: 1
          - name: "Alex Smith (son)"
            share_index: 2
          - name: "Family estate attorney"
            contact: "estate-law@example.org"
            share_index: 3

  - name: person
    path: data/person
    # the human-context layer itself (biography, timeline, people, places)
    # no override: inherits the capsule default

  - name: provenance
    path: data/provenance
    # the event/provenance log (see ../METADATA.md) — recommended, not
    # required. no override: inherits the capsule default

access:
  # one of: public | restricted | never-release
  default_privacy_zone: restricted
  default_release_policy:
    # one of: immediate | fixed_date | after_death | after_death_plus_years | never | custom
    type: fixed_date
    date: "2076-08-20"

custody:
  primary:
    name: "TBD — a special collections department or similar institution"
    type: institution
  successors:
    - name: "TBD — fallback institution #1"
      type: institution
    - name: "TBD — fallback institution #2"
      type: institution

# Covers every collection that doesn't declare its own `encryption`
# override above (photos, writing, person, provenance) — all inheriting
# the capsule-wide default_release_policy (fixed_date, 2076-08-20).
# See ../ENCRYPTION.md (ROADMAP.md item 13).
encryption:
  status: planned    # planned | encrypted | none
  algorithm: xchacha20-poly1305
  key_custody:
    scheme: quorum
    splitting_scheme: slip-0039
    quorum:
      required: 3
      of: 5
    trustees:
      # Bookkeeping only — never the actual SLIP-0039 share material,
      # which lives with each trustee, outside the capsule entirely.
      - name: "Priya Smith (daughter)"
        share_index: 1
      - name: "Alex Smith (son)"
        share_index: 2
      - name: "Sam Smith (spouse)"
        share_index: 3
      - name: "Family estate attorney"
        contact: "estate-law@example.org"
        share_index: 4
      - name: "Springfield Historical Society (custodian)"
        share_index: 5

integrity:
  manifest_algorithm: sha256

status:
  # tracks LIFECYCLE.md's stages
  lifecycle_stage: origination
