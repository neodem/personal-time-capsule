[package]
name = "ptc"
version = "0.1.0"
edition = "2021"
description = "Personal Time Capsule reference CLI"
license = "Apache-2.0"
repository = "https://github.com/neodem/personal-time-capsule"

[lib]
name = "ptc"
path = "src/lib.rs"

[[bin]]
name = "ptc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# serde_yaml itself is unmaintained; yaml_serde is the maintained fork from
# The YAML Organization, published as a drop-in replacement -- renaming the
# dependency here keeps `use serde_yaml` working throughout the crate.
serde_yaml = { package = "yaml_serde", version = "0.10" }
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
