[package]
name = "ptc"
version = "0.1.0"
edition = "2021"
description = "Personal Time Capsule reference CLI"
license = "Apache-2.0"
repository = "https://github.com/neodem/personal-time-capsule"

[lib]
name = "ptc"
path = "src/lib.rs"

[[bin]]
name = "ptc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
# serde_yaml itself is unmaintained (dtolnay archived it); yaml_serde is
# the maintained fork from The YAML Organization (github.com/yaml).
yaml_serde = "0.10"
sha2 = "0.10"
walkdir = "2"
regex = "1"
# ENCRYPTION.md's locked algorithm choice; see cli/src/cipher.rs for why
# call sites go through a Cipher trait instead of this crate's API directly.
chacha20poly1305 = "0.11"
# ptc deposit's optional --archive: BagIt's own spec calls this
# "serialization" -- a single-file wrapper purely for transport, unpacked
# back into the same directory before anything is actually verified.
tar = "0.4"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
tempfile = "3"
